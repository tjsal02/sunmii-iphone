<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>선미의 iPhone</title><style>*{box-sizing:border-box}body{margin:0;background:#171923;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;display:grid;place-items:center;min-height:100dvh}.phone{width:min(390px,100vw);height:min(820px,100dvh);border:7px solid #282832;border-radius:44px;overflow:hidden;position:relative;background:linear-gradient(155deg,#e6b8d6,#8571b8 52%,#393e7a);box-shadow:0 25px 70px #0008}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:108px;height:28px;background:#111;border-radius:22px;z-index:10}.status{position:absolute;top:15px;left:30px;right:24px;display:flex;justify-content:space-between;font-size:14px;font-weight:650;z-index:9}.screen{position:absolute;inset:0;padding-top:55px}.lock{display:flex;flex-direction:column;align-items:center;cursor:pointer}.lock .date{font-size:19px;margin-top:58px}.lock .clock{font-size:77px;font-weight:200;letter-spacing:-4px}.lock .hint{margin-top:auto;margin-bottom:68px;font-size:14px}.pass{background:linear-gradient(150deg,#a781b9,#4a538e);text-align:center;padding:110px 35px 30px}.dots{font-size:36px;letter-spacing:10px;margin:18px 0}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px auto;max-width:290px}.digit{border:0;border-radius:50%;aspect-ratio:1;background:#ffffff3a;color:white;font-size:28px;cursor:pointer}.digit:active{background:#ffffff80}.home{background:linear-gradient(150deg,#e9a7c6,#9877bd 55%,#51599a);padding:90px 24px 25px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 12px}.app{border:0;background:none;color:white;font-size:12px;cursor:pointer;display:flex;align-items:center;flex-direction:column;gap:7px}.emoji{width:58px;height:58px;border-radius:15px;background:#fff9;display:grid;place-items:center;font-size:30px;box-shadow:0 3px 9px #0002}.dock{position:absolute;bottom:30px;left:18px;right:18px;border-radius:24px;background:#ffffff4a;padding:13px;display:flex;justify-content:space-around}.page{background:#f7f7fa;color:#161616;padding:65px 0 20px;overflow:auto}.bar{display:flex;align-items:center;gap:12px;padding:5px 18px 15px;border-bottom:1px solid #ddd;font-size:20px;font-weight:700;position:sticky;top:-65px;background:#f7f7fa;z-index:2}.back{background:none;border:0;font-size:26px;cursor:pointer}.entry{padding:16px 20px;border-bottom:1px solid #e4e4e4;cursor:pointer}.entry small{color:#888}.chat{background:#b0c6d4;min-height:100%;padding:15px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:78%;padding:10px 13px;border-radius:12px;background:white;color:#222;font-size:14px;line-height:1.5;align-self:flex-start}.bubble.me{background:#ffe45c;align-self:flex-end}.sender{font-size:11px;color:#455b68;margin-bottom:3px}.chatrow{display:flex;flex-direction:column;align-items:flex-start}.chatrow.mine{align-items:flex-end}.navhome{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:5px;background:#3339;cursor:pointer}.note{padding:22px;line-height:1.9;white-space:pre-line}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px}.photo{aspect-ratio:1;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#e7b2c7,#b1b6e3)}.muted{color:#777;font-size:13px;padding:12px 20px}.intro{position:absolute;bottom:3px;left:0;right:0;text-align:center;color:#ffffff9a;font-size:10px}</style></head><body><div class="phone"><div class="island"></div><div class="status"><span id="time">9:41</span><span>●●● ▰</span></div><main id="view" class="screen lock" onclick="showPass()" ontouchend="showPass()"><div class="date">11월 6일 금요일</div><div class="clock">9:41</div><div class="hint">화면을 탭해서 잠금 해제 ↑</div></main><div class="navhome" onclick="home()"></div></div><script>const v=document.getElementById('view');let typed='',active='';const chats=[{name:'너네 셋 다 싫어 (4)',preview:'박성훈: 엄마 미팅 늦겠다',messages:[['심재윤','얘들아 우리 방 이름 너무 부정적이지 않냐'],['박선미','예를 들면?'],['심재윤','영원한 우리 우정'],['박성훈','싫어'],['박선미','아 토나와ㅋㅋㅋㅋ'],['박종성','그냥 둬'],['심재윤','사랑과 우정 사이 어때'],['박성훈','누구랑 사랑하는데'],['심재윤','우리 넷이'],['박종성','하지 마'],['박선미','ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ'],['박성훈','엄마 미팅 늦겠다']]},{name:'양정원 🐈‍⬛',preview:'누나 뭐해요',messages:[['양정원','누나 뭐해요'],['박선미','너 생각'],['양정원','ㅋㅋㅋㅋ 진짜?'],['박선미','아니 밥 먹어'],['양정원','저도 누나 생각하고 있었는데'],['박선미','야'],['양정원','왜요ㅋㅋ 귀여워서']]},{name:'여덟이면 시끄럽다 (8)',preview:'심재윤: 비행기는 누가',messages:[['심재윤','비행기는 누가'],['박성훈','너 비행기 조종할 수 있어?'],['심재윤','못하지'],['박성훈','그럼 누가 해'],['박선미','ㅋㅋㅋㅋㅋㅋㅋㅋ'],['박종성','너네 정산 안 하면 다음 여행 없어'],['양정원','형 저 입금했어요ㅋㅋ']]},{name:'남친들 출입금지💋 (4)',preview:'한지아: 오늘 볼래?',messages:[['한지아','얘들아 오늘 볼래?'],['박선미','나 나 나'],['최서윤','몇 시?'],['이하린','저도 갈래요!! 💗']]}];function setPage(cls,html){v.className='screen '+cls;v.onclick=null;v.innerHTML=html}function showPass(){typed='';renderPass()}function renderPass(err=''){setPage('pass',`<div style="font-size:18px">암호 입력</div><div class="dots">${'●'.repeat(typed.length)}${'○'.repeat(4-typed.length)}</div><div style="height:18px;color:#ffe5e5">${err}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(x=>x===''?'<span></span>':`<button class="digit" onclick="digit('${x}')">${x}</button>`).join('')}</div><div style="font-size:12px">비밀번호 4자리</div>`)}function digit(d){if(d==='⌫')typed=typed.slice(0,-1);else typed+=d;if(typed.length===4){if(typed==='1009'){home();return}typed='';renderPass('암호가 틀렸습니다');return}renderPass()}function home(){setPage('home',`<div class="apps">${[['💬','카카오톡','kakao'],['🖼️','사진','photos'],['📝','메모','notes'],['💗','일기','diary'],['📅','캘린더','calendar'],['🎵','음악','music'],['⚙️','설정','settings'],['🐈','고양이','cat']].map(a=>`<button class="app" onclick="openApp('${a[2]}')"><span class="emoji">${a[0]}</span>${a[1]}</button>`).join('')}</div><div class="dock">📞　🌐　📷　💌</div>`)}function page(title,body){setPage('page',`<div class="bar"><button class="back" onclick="home()">‹</button>${title}</div>${body}`)}function openApp(app){if(app==='kakao'){page('채팅',chats.map((c,i)=>`<div class="entry" onclick="chat(${i})"><b>💬 ${c.name}</b><br><small>${c.preview}</small></div>`).join(''));return}if(app==='photos'){page('사진',`<div class="photos">${['🐈‍⬛','🍰','🌷','☕','🎀','🌅','🍓','🐱','💐','🌊','🍜','💗'].map(x=>`<div class="photo">${x}</div>`).join('')}</div><div class="muted">선미의 소중한 순간들 ♡</div>`);return}if(app==='notes'){page('메모',`<div class="note">🛒 사고 싶은 것\n- 검정 재킷\n- 예쁜 가방\n- 고양이 굿즈\n\n🍜 먹고 싶은 것\n- 마라탕\n- 초밥\n- 떡볶이\n\n📌 잊지 말기\n- 박박심한테 사진 보내기\n- 정원이랑 데이트 ♡</div>`);return}if(app==='diary'){page('일기',`<div class="note">11월 6일 🌷\n\n오늘도 단톡방은 난리였다.\n재윤이는 이상한 사진을 보내고, 성훈이는 한마디로 사람을 웃기고, 종성이는 또 알림을 껐다.\n\n그래도 얘들이랑 있으면 재밌다.\n\n정원이 보고 싶다 🐈‍⬛</div>`);return}page(({calendar:'캘린더',music:'음악',settings:'설정',cat:'고양이'})[app],`<div class="note">${({calendar:'📅 오늘도 좋은 하루!',music:'🎧 오늘의 플레이리스트',settings:'📱 선미의 가상 아이폰',cat:'🐈‍⬛ 야옹! 🐾'})[app]}</div>`)}function chat(i){const c=chats[i];setPage('page',`<div class="bar"><button class="back" onclick="openApp('kakao')">‹</button>${c.name}</div><div class="chat">${c.messages.map(([name,msg])=>`<div class="chatrow ${name==='박선미'?'mine':''}">${name==='박선미'?'':`<div class="sender">${name}</div>`}<div class="bubble ${name==='박선미'?'me':''}">${msg}</div></div>`).join('')}</div>`)} </script></body></html>
